name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to release, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/weaveflow', secrets.DOCKERHUB_USERNAME) }}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate semantic version tag
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must follow vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease." >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify VERSION matches release tag
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          expected="${TAG#v}"
          actual="$(tr -d '[:space:]' < VERSION)"
          if [ "$actual" != "$expected" ]; then
            echo "VERSION ($actual) must match release tag ($expected)." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Go packages
        run: go build ./...

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.4

      - name: Install web dependencies
        working-directory: internal/web
        run: bun install --frozen-lockfile

      - name: Build web application
        working-directory: internal/web
        run: bun run build

  release-assets:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }} release asset
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build server archive
        env:
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -eu
          version="${RELEASE_VERSION#v}"
          archive_name="weaveflow-server-${version}-${GOOS}-${GOARCH}"
          package_dir="dist/${archive_name}"
          mkdir -p "$package_dir"
          binary_name="weaveflow-server"
          if [ "$GOOS" = windows ]; then
            binary_name="${binary_name}.exe"
          fi
          go build -buildvcs=false -trimpath -ldflags="-s -w" \
            -o "$package_dir/$binary_name" ./cmd/server
          cp LICENSE README.md "$package_dir/"
          if [ "$GOOS" = windows ]; then
            (cd dist && zip -qr "${archive_name}.zip" "$archive_name")
          else
            tar -C dist -czf "dist/${archive_name}.tar.gz" "$archive_name"
          fi

      - name: Upload release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  dockerhub:
    name: Publish Docker Hub image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Compute VCS reference
        run: echo "VCS_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN Actions secrets are required." >&2
            exit 1
          fi
          if [[ -z "$DOCKERHUB_IMAGE" ]]; then
            echo "Set DOCKERHUB_IMAGE or provide DOCKERHUB_USERNAME for the default image name." >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ !contains(env.RELEASE_TAG, '-') }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }},enable=${{ !contains(env.RELEASE_TAG, '-') }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}

      - name: Normalize release version
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: scripts/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_VERSION }}
            VCS_REF=${{ env.VCS_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Docker image
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "docker.io/${DOCKERHUB_IMAGE}@${IMAGE_DIGEST}"

      - name: Attest Docker image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: Graph-based runtime for building, executing, and inspecting LLM agents in Go.
          readme-filepath: ./README.md

      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            printf 'image=%s\n' "$DOCKERHUB_IMAGE"
            printf 'digest=%s\n' "$IMAGE_DIGEST"
            printf 'tag=%s\n' "$RELEASE_TAG"
          } > image-digest.txt

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-digest
          path: image-digest.txt
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs:
      - release-assets
      - dockerhub
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: Generate combined checksums
        working-directory: release-files
        run: sha256sum *.tar.gz *.zip > checksums.txt

      - name: Prepare release upload directory
        run: |
          set -eu
          mkdir -p release-upload
          find release-files -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name 'image-digest.txt' \) \
            -exec cp {} release-upload/ \;
          cp release-files/checksums.txt release-upload/

      - name: Create draft and upload assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          files: release-upload/*

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: gh release edit "$RELEASE_TAG" --draft=false

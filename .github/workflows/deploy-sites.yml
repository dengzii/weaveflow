name: Deploy websites

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-static-sites
  cancel-in-progress: false

jobs:
  changes:
    name: Select deployment revision
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.select.outputs.deploy }}
      revision: ${{ steps.select.outputs.revision }}
    steps:
      - name: Check out deployment revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Detect site changes
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          deploy=false
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            deploy=true
          else
            website_revision="$(curl --fail --silent --show-error --max-time 10 \
              https://weaveflow.space/deployment.txt 2>/dev/null || true)"
            playground_revision="$(curl --fail --silent --show-error --max-time 10 \
              https://playground.weaveflow.space/deployment.txt 2>/dev/null || true)"
            if [[ ! "$website_revision" =~ ^[0-9a-f]{40}$ ]] || \
              [[ "$website_revision" != "$playground_revision" ]]; then
              deploy=true
            elif [[ "$website_revision" != "$REVISION" ]] && \
              git fetch --no-tags --depth=1 origin "$website_revision"; then
              while IFS= read -r path; do
                case "$path" in
                  .github/workflows/deploy-sites.yml|assets/*|internal/web/*|internal/website/*)
                    deploy=true
                    break
                    ;;
                esac
              done < <(git diff --name-only "$website_revision" "$REVISION")
            elif [[ "$website_revision" != "$REVISION" ]]; then
              deploy=true
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build and deploy static sites
    needs: changes
    if: ${{ needs.changes.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-sites
      url: https://weaveflow.space
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER || 'weaveflow-deploy' }}
      PLAYGROUND_BACKEND_BASE_URL: ${{ vars.PLAYGROUND_BACKEND_BASE_URL || 'http://localhost:8080' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.revision }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.4

      - name: Build website and documentation
        working-directory: internal/website
        run: bun run build

      - name: Install Playground dependencies
        working-directory: internal/web
        run: bun install --frozen-lockfile

      - name: Build Playground
        working-directory: internal/web
        run: bun run build

      - name: Configure Playground backend
        run: |
          bun -e '
            const value = (process.env.PLAYGROUND_BACKEND_BASE_URL ?? "").trim();
            if (!value) throw new Error("PLAYGROUND_BACKEND_BASE_URL is required");
            if (value.startsWith("//")) throw new Error("protocol-relative backend URL is not allowed");
            if (!value.startsWith("/")) {
              const url = new URL(value);
              if (url.protocol !== "http:" && url.protocol !== "https:") {
                throw new Error("backend URL must use http or https");
              }
              if (url.username || url.password || url.search || url.hash) {
                throw new Error("backend URL must not contain credentials, query, or fragment");
              }
            }
            await Bun.write(
              "internal/web/dist/config.js",
              `window.__WEAVEFLOW_CONFIG__ = {\n  backendBaseUrl: ${JSON.stringify(value)},\n};\n`,
            );
          '

      - name: Package deployment bundles
        env:
          REVISION: ${{ needs.changes.outputs.revision }}
        run: |
          set -euo pipefail
          printf '%s\n' "$REVISION" > internal/website/dist/deployment.txt
          printf '%s\n' "$REVISION" > internal/web/dist/deployment.txt
          tar -C internal/website/dist -czf "$RUNNER_TEMP/weaveflow-website.tar.gz" .
          tar -C internal/web/dist -czf "$RUNNER_TEMP/weaveflow-playground.tar.gz" .
          sha256sum \
            "$RUNNER_TEMP/weaveflow-website.tar.gz" \
            "$RUNNER_TEMP/weaveflow-playground.tar.gz"

      - name: Configure deployment SSH identity
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          case "$EC2_HOST" in
            ''|*[!A-Za-z0-9.-]*|-*) echo "EC2_HOST is invalid" >&2; exit 1 ;;
          esac
          case "$EC2_USER" in
            ''|*[!A-Za-z0-9_-]*|-*) echo "EC2_USER is invalid" >&2; exit 1 ;;
          esac
          test -n "$EC2_SSH_PRIVATE_KEY" || { echo "EC2_SSH_PRIVATE_KEY is required" >&2; exit 1; }
          test -n "$EC2_SSH_KNOWN_HOSTS" || { echo "EC2_SSH_KNOWN_HOSTS is required" >&2; exit 1; }
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$EC2_SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null
          ssh-keygen -F "$EC2_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Upload and activate deployment
        env:
          DEPLOY_ID: ${{ needs.changes.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          remote="${EC2_USER}@${EC2_HOST}"
          ssh_options=(
            -i "$HOME/.ssh/deploy_key"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          cleanup_remote() {
            ssh "${ssh_options[@]}" "$remote" \
              "rm -f -- /tmp/weaveflow-website-${DEPLOY_ID}.tar.gz /tmp/weaveflow-playground-${DEPLOY_ID}.tar.gz" \
              >/dev/null 2>&1 || true
          }
          trap cleanup_remote EXIT
          scp "${ssh_options[@]}" "$RUNNER_TEMP/weaveflow-website.tar.gz" \
            "$remote:/tmp/weaveflow-website-${DEPLOY_ID}.tar.gz"
          scp "${ssh_options[@]}" "$RUNNER_TEMP/weaveflow-playground.tar.gz" \
            "$remote:/tmp/weaveflow-playground-${DEPLOY_ID}.tar.gz"
          ssh "${ssh_options[@]}" "$remote" \
            "sudo -n /usr/local/sbin/weaveflow-deploy-sites '${DEPLOY_ID}'"

      - name: Verify public sites
        env:
          REVISION: ${{ needs.changes.outputs.revision }}
        run: |
          set -euo pipefail
          curl_options=(--fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2)
          test "$(curl "${curl_options[@]}" https://weaveflow.space/deployment.txt)" = "$REVISION"
          curl "${curl_options[@]}" https://weaveflow.space/docs/ >/dev/null
          test "$(curl "${curl_options[@]}" https://playground.weaveflow.space/deployment.txt)" = "$REVISION"
          curl "${curl_options[@]}" https://playground.weaveflow.space/app/graph >/dev/null

name: Codespaces Demo Image

on:
  push:
    branches:
      - master
    paths:
      - '.devcontainer/demo/**'
      - '.github/workflows/codespaces-demo.yml'
      - 'assets/**'
      - 'builtin/**'
      - 'capability/**'
      - 'cmd/**'
      - 'core/**'
      - 'dsl/**'
      - 'examples/codespaces_demo/**'
      - 'graph/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/**'
      - 'llms/**'
      - 'node/**'
      - 'registry/**'
      - 'runtime/**'
      - 'scripts/nginx.conf.template'
      - 'scripts/web-config.js.template'
      - 'state/**'
      - 'tools/**'
      - '*.go'
      - '.dockerignore'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: codespaces-demo-${{ github.ref }}
  cancel-in-progress: true

env:
  DEMO_IMAGE: ghcr.io/dengzii/weaveflow-codespaces

jobs:
  publish:
    if: github.repository == 'dengzii/weaveflow'
    name: Publish Codespaces Demo image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DEMO_IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,format=short,prefix=sha-

      - name: Build and push Demo image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .devcontainer/demo/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          cache-from: type=gha,scope=codespaces-demo
          cache-to: type=gha,mode=max,scope=codespaces-demo,ignore-error=true
          provenance: false
          sbom: false
